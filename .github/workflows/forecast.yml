name: TimesFM-3 Forex Forecast

on:
  workflow_dispatch:
  schedule:
    # Daily 04:00 UTC — adjust to your preference.
    - cron: '0 4 * * *'

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_ETAG_TIMEOUT: '30'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install TimesFM
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Forecast daily EURUSD
        run: |
          python forecast.py --csv data/eurusd_daily.csv --horizon 14 --context 1024 --device cpu

      - name: Forecast 4H EURUSD
        run: |
          python forecast.py --csv data/eurusd_4h.csv --horizon 48 --context 1024 --device cpu

      - name: Upload forecasts
        uses: actions/upload-artifact@v4
        with:
          name: forecasts
          path: |
            data/*_forecast_*.csv
          if-no-files-found: error