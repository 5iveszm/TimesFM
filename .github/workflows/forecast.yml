name: TimesFM-3 Forex Forecast

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch live market data
        run: |
          python fetch_data.py --symbol EURUSD=X --tf D --out data/eurusd_daily.csv
          python fetch_data.py --symbol EURUSD=X --tf 240 --out data/eurusd_4h.csv
          python fetch_data.py --symbol GC=F --tf D --out data/xauusd_daily.csv
          python fetch_data.py --symbol GC=F --tf 240 --out data/xauusd_4h.csv
          python -c "print('Using GC=F (COMEX gold futures) as XAUUSD proxy; EURUSD=X for EURUSD.')"

      - name: Forecast daily EURUSD (14 days)
        run: |
          python forecast.py --csv data/eurusd_daily.csv --horizon 14 --context 1024 --device cpu

      - name: Forecast 4H EURUSD (48 bars)
        run: |
          python forecast.py --csv data/eurusd_4h.csv --horizon 48 --context 1024 --device cpu

      - name: Forecast daily XAUUSD (14 days)
        run: |
          python forecast.py --csv data/xauusd_daily.csv --horizon 14 --context 1024 --device cpu

      - name: Forecast 4H XAUUSD (48 bars)
        run: |
          python forecast.py --csv data/xauusd_4h.csv --horizon 48 --context 1024 --device cpu

      - name: Backtest daily EURUSD (7-day, 40 sweeps)
        run: |
          python backtest.py --csv data/eurusd_daily.csv --horizon 7 --context 1024 --samples 40 --device cpu

      - name: Backtest 4H EURUSD (24-bar, 25 sweeps)
        run: |
          python backtest.py --csv data/eurusd_4h.csv --horizon 24 --context 1024 --samples 25 --device cpu

      - name: Backtest daily XAUUSD (7-day, 40 sweeps)
        run: |
          python backtest.py --csv data/xauusd_daily.csv --horizon 7 --context 1024 --samples 40 --device cpu

      - name: Backtest 4H XAUUSD (24-bar, 25 sweeps)
        run: |
          python backtest.py --csv data/xauusd_4h.csv --horizon 24 --context 1024 --samples 25 --device cpu

      - name: Plot daily forecast
        run: |
          python plot_forecast.py --csv data/eurusd_daily.csv \
            --forecast data/eurusd_daily_forecast_14.csv \
            --out data/plot_eurusd_daily.png --history 120

      - name: Plot 4H forecast
        run: |
          python plot_forecast.py --csv data/eurusd_4h.csv \
            --forecast data/eurusd_4h_forecast_48.csv \
            --out data/plot_eurusd_4h.png --history 150

      - name: Plot daily XAUUSD
        run: |
          python plot_forecast.py --csv data/xauusd_daily.csv \
            --forecast data/xauusd_daily_forecast_14.csv \
            --out data/plot_xauusd_daily.png --history 120

      - name: Plot 4H XAUUSD
        run: |
          python plot_forecast.py --csv data/xauusd_4h.csv \
            --forecast data/xauusd_4h_forecast_48.csv \
            --out data/plot_xauusd_4h.png --history 150

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: forecasts
          path: |
            data/*_forecast_*.csv
            data/backtest_*.csv
            data/plot_*.png
          if-no-files-found: error